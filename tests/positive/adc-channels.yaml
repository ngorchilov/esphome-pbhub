esphome:
  name: pbhub-adc-channels

packages:
  common: !include ../common/esp32-idf.yaml

pbhub:
  id: test_hub
  i2c_id: test_i2c

sensor:
  - platform: pbhub
    id: adc_channel_0
    pbhub_id: test_hub
    channel: 0
    update_interval: 250ms
  - platform: pbhub
    id: adc_channel_1
    pbhub_id: test_hub
    channel: 1
  - platform: pbhub
    id: adc_channel_2
    pbhub_id: test_hub
    channel: 2
  - platform: pbhub
    id: adc_channel_3
    pbhub_id: test_hub
    channel: 3
  - platform: pbhub
    id: adc_channel_4
    pbhub_id: test_hub
    channel: 4
  - platform: pbhub
    id: adc_channel_5
    pbhub_id: test_hub
    channel: 5
