esphome:
  name: pbhub-phase2-ownership

packages:
  common: !include ../common/esp32-idf.yaml

pbhub:
  id: test_hub
  i2c_id: test_i2c

output:
  - platform: pbhub
    id: pwm_channel_0a
    pbhub_id: test_hub
    channel: 0
    signal: a
    mode: pwm

sensor:
  - platform: pbhub
    id: adc_channel_1a
    pbhub_id: test_hub
    channel: 1

light:
  - platform: pbhub
    id: rgb_channel_1b
    pbhub_id: test_hub
    channel: 1
    num_leds: 12
