esphome:
  name: pbhub-phase1-rgb

packages:
  common: !include ../common/esp32-idf.yaml

pbhub:
  id: test_hub
  i2c_id: test_i2c

light:
  - platform: pbhub
    id: rgb_one_led
    output_id: rgb_always_off_output
    pbhub_id: test_hub
    slot: 0
    num_leds: 1
  - platform: pbhub
    id: rgb_max_leds
    output_id: rgb_restore_default_output
    pbhub_id: test_hub
    slot: 5
    num_leds: 74
    restore_mode: RESTORE_DEFAULT_OFF
    default_transition_length: 250ms
    gamma_correct: 2.2
    effects:
      - pulse:
          name: Slow uniform pulse
          transition_length: 100ms
          update_interval: 500ms
  - platform: pbhub
    id: rgb_intermediate_leds
    output_id: rgb_restore_and_off_output
    pbhub_id: test_hub
    slot: 3
    num_leds: 12
    restore_mode: RESTORE_AND_OFF
  - platform: pbhub
    id: rgb_always_on
    output_id: rgb_always_on_output
    pbhub_id: test_hub
    slot: 4
    num_leds: 6
    restore_mode: ALWAYS_ON
