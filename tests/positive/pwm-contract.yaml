esphome:
  name: pbhub-phase4-pwm-contract

packages:
  common: !include ../common/esp32-idf.yaml

pbhub:
  id: test_hub
  i2c_id: test_i2c

# Signal A and signal B on one channel are independent endpoints.
sensor:
  - platform: pbhub
    id: adc_channel_0
    pbhub_id: test_hub
    channel: 0

output:
  - platform: pbhub
    id: pwm_signal_b
    pbhub_id: test_hub
    channel: 0
    signal: b
    mode: pwm
  - platform: pbhub
    id: pwm_inverted
    pbhub_id: test_hub
    channel: 1
    signal: a
    mode: pwm
    inverted: true
  - platform: pbhub
    id: pwm_scaled_zero
    pbhub_id: test_hub
    channel: 1
    signal: b
    mode: pwm
    min_power: 10%
    max_power: 90%
    zero_means_zero: true
  - platform: pbhub
    id: pwm_scaled_floor
    pbhub_id: test_hub
    channel: 2
    signal: a
    mode: pwm
    min_power: 20%
    max_power: 80%
