esphome:
  name: pbhub-phase3-digital

packages:
  common: !include ../common/esp32-idf.yaml

pbhub:
  id: test_hub
  i2c_id: test_i2c

binary_sensor:
  - platform: pbhub
    id: input_0a
    pbhub_id: test_hub
    channel: 0
    signal: a
    update_interval: 50ms
  - platform: pbhub
    id: input_1b
    pbhub_id: test_hub
    channel: 1
    signal: b
    update_interval: 100ms
    inverted: true
  - platform: pbhub
    id: input_2a
    pbhub_id: test_hub
    channel: 2
    signal: a
    update_interval: 150ms
    filters:
      - delayed_off: 25ms
  - platform: pbhub
    id: input_3b
    pbhub_id: test_hub
    channel: 3
    signal: b
    update_interval: 200ms
    inverted: true
  - platform: pbhub
    id: input_4a
    pbhub_id: test_hub
    channel: 4
    signal: a
    update_interval: 250ms
  - platform: pbhub
    id: input_5b
    pbhub_id: test_hub
    channel: 5
    signal: b
    update_interval: 300ms
    inverted: true

switch:
  - platform: pbhub
    id: switch_0b
    pbhub_id: test_hub
    channel: 0
    signal: b
  - platform: pbhub
    id: switch_1a
    pbhub_id: test_hub
    channel: 1
    signal: a
    inverted: true
    restore_mode: ALWAYS_OFF
  - platform: pbhub
    id: switch_2b
    pbhub_id: test_hub
    channel: 2
    signal: b
    restore_mode: RESTORE_DEFAULT_OFF
  - platform: pbhub
    id: switch_3a
    pbhub_id: test_hub
    channel: 3
    signal: a
    inverted: true
    restore_mode: ALWAYS_OFF
  - platform: pbhub
    id: switch_4b
    pbhub_id: test_hub
    channel: 4
    signal: b
    restore_mode: ALWAYS_OFF
  - platform: pbhub
    id: switch_5a
    pbhub_id: test_hub
    channel: 5
    signal: a
    inverted: true
    restore_mode: DISABLED
