    slot: 0
    update_interval: 1s
  - platform: pbhub
    id: adc_slot_1
    pbhub_id: test_hub
    slot: 1
  - platform: pbhub
    id: adc_slot_2
    pbhub_id: test_hub
    slot: 2
  - platform: pbhub
    id: adc_slot_3
    pbhub_id: test_hub
    slot: 3
  - platform: pbhub
    id: adc_slot_4
    pbhub_id: test_hub
    slot: 4
  - platform: pbhub
    id: adc_slot_5
    pbhub_id: test_hub
    slot: 5
