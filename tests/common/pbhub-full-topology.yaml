tca9548a:
  id: test_multiplexer
  i2c_id: test_i2c_primary
  address: 0x70
  channels:
    - bus_id: test_multiplexer_channel_3
      channel: 3
    - bus_id: test_multiplexer_channel_4
      channel: 4

pbhub:
  - id: feature_hub
    i2c_id: test_i2c_secondary
    address: 0x61
    led_timing_mode: 0
  - id: same_bus_hub
    i2c_id: test_i2c_secondary
    address: 0x62
  - id: primary_bus_hub
    i2c_id: test_i2c_primary
    address: 0x62
    led_timing_mode: 1
  - id: multiplexed_hub_3
    i2c_id: test_multiplexer_channel_3
    address: 0x61
  - id: multiplexed_hub_4
    i2c_id: test_multiplexer_channel_4
    address: 0x61

binary_sensor:
  - platform: pbhub
    id: topology_binary_sensor
    pbhub_id: feature_hub
    channel: 0
    signal: a
    update_interval: 100ms

switch:
  - platform: pbhub
    id: topology_switch
    pbhub_id: feature_hub
    channel: 0
    signal: b
    restore_mode: ALWAYS_OFF

sensor:
  - platform: pbhub
    id: topology_adc
    pbhub_id: feature_hub
    channel: 1
    update_interval: 1s

output:
  - platform: pbhub
    id: topology_pwm
    pbhub_id: feature_hub
    channel: 1
    signal: b
    mode: pwm
    min_power: 10%
    max_power: 90%
    zero_means_zero: true
  - platform: pbhub
    id: topology_servo_output
    pbhub_id: feature_hub
    channel: 2
    signal: a
    mode: servo
  - platform: pbhub
    id: topology_same_bus_pwm
    pbhub_id: same_bus_hub
    channel: 0
    signal: a
    mode: pwm
  - platform: pbhub
    id: topology_primary_bus_pwm
    pbhub_id: primary_bus_hub
    channel: 0
    signal: a
    mode: pwm
  - platform: pbhub
    id: topology_multiplexed_3_pwm
    pbhub_id: multiplexed_hub_3
    channel: 0
    signal: a
    mode: pwm
  - platform: pbhub
    id: topology_multiplexed_4_pwm
    pbhub_id: multiplexed_hub_4
    channel: 0
    signal: a
    mode: pwm

servo:
  - id: topology_servo
    output: topology_servo_output
    min_level: 2.5%
    idle_level: 7.5%
    max_level: 12.5%
    transition_length: 0s

light:
  - platform: pbhub
    id: topology_rgb
    pbhub_id: feature_hub
    channel: 2
    num_leds: 12
