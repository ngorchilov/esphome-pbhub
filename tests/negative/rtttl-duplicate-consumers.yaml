esphome:
  name: pbhub-rtttl-duplicate-consumers

packages:
  common: !include ../common/esp32-idf.yaml

pbhub:
  id: test_hub
  i2c_id: test_i2c

output:
  - platform: pbhub
    id: buzzer_output
    pbhub_id: test_hub
    channel: 0
    signal: b
    mode: pwm
    zero_means_zero: true

rtttl:
  - id: first_player
    output: buzzer_output
  - id: second_player
    output: buzzer_output
