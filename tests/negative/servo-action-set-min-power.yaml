esphome:
  name: pbhub-servo-action-min
  on_boot:
    then:
      - output.set_min_power:
          id: servo_output
          min_power: 1%

packages:
  common: !include ../common/esp32-idf.yaml

pbhub:
  id: test_hub
  i2c_id: test_i2c

output:
  - platform: pbhub
    id: servo_output
    pbhub_id: test_hub
    channel: 0
    signal: a
    mode: servo
