esphome:
  name: pbhub-rtttl-reversed-power

packages:
  common: !include ../common/esp32-idf.yaml

pbhub:
  id: test_hub
  i2c_id: test_i2c

output:
  - platform: pbhub
    id: buzzer_output
    pbhub_id: test_hub
    channel: 0
    signal: b
    mode: pwm
    min_power: 100%
    max_power: 0%
    zero_means_zero: true

rtttl:
  output: buzzer_output
  gain: 50%
