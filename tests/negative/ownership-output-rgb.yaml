esphome:
  name: pbhub-ownership-output-rgb

packages:
  common: !include ../common/esp32-idf.yaml

pbhub:
  id: test_hub
  i2c_id: test_i2c

output:
  - platform: pbhub
    id: pwm_conflict
    pbhub_id: test_hub
    channel: 2
    signal: b
    mode: pwm

light:
  - platform: pbhub
    id: rgb_conflict
    pbhub_id: test_hub
    channel: 2
    num_leds: 12
