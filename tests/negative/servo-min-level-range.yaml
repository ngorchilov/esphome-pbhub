esphome:
  name: pbhub-servo-min-level

packages:
  common: !include ../common/esp32-arduino.yaml

pbhub:
  id: test_hub
  i2c_id: test_i2c

output:
  - platform: pbhub
    id: servo_output
    pbhub_id: test_hub
    pin: 0
    mode: servo

servo:
  - id: invalid_servo
    output: servo_output
    min_level: 2.4%
