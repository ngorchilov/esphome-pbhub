esphome:
  name: pbhub-servo-action-max
  on_boot:
    then:
      - output.set_max_power:
          id: servo_output
          max_power: 99%

packages:
  common: !include ../common/esp32-idf.yaml

pbhub:
  id: test_hub
  i2c_id: test_i2c

output:
  - platform: pbhub
    id: servo_output
    pbhub_id: test_hub
    pin: 0
    mode: servo
